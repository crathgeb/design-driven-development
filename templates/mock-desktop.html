<!doctype html>
<!-- design-driven-development mock for a desktop or laptop state (a web app at 1440×900 or 1280×800): one
     state of one screen. Copy to mocks/<screen-id>--<state-id>.html. Build it from kit classes: kit/mock.css
     for the basics, kit/desktop.css for the app shell, tables, forms, menus and dialogs (kit/README.md,
     "Desktop and web"); keep the <style> block for what the kit lacks. Links: /kit/mock.css, /kit/desktop.css,
     then the project's brand /theme.css (export rewrites them to ../kit/ and ../theme.css).
     The page scrolls as a whole: no position: fixed, no inner scrolling areas. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCREEN TITLE · STATE TITLE</title>
<link rel="stylesheet" href="/kit/mock.css">
<link rel="stylesheet" href="/kit/desktop.css">
<link rel="stylesheet" href="/theme.css">
<script src="/kit/mock.js" defer></script>
<style>
  /* Only the few styles this screen needs that the kit has no class for, built on the kit's variables
     (var(--accent), var(--r-md)). The brand (colours, fonts, radii) is theme.css's job: never hard-code it here. */
</style>
</head>
<body>
<div class="app">
  <nav class="sidenav">
    <div class="sidenav-brand"><span class="logo">P</span>Product</div>
    <a class="nav-item on"><i class="icon i-home"></i>Overview</a>
    <a class="nav-item"><i class="icon i-list"></i>Items<span class="nav-end">24</span></a>
    <a class="nav-item"><i class="icon i-gear"></i>Settings</a>
    <div class="sidenav-foot"><span class="avatar">LM</span><div class="who">Léa Martin<span>Owner</span></div></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="search"><i class="icon i-search"></i>Search<span class="kbd">/</span></div>
      <span class="spacer"></span>
      <button class="btn sm outline">Secondary</button>
      <button class="btn sm">Primary action</button>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <nav class="breadcrumbs"><a>Overview</a><span>Screen title</span></nav>
          <h1 class="page-title">Screen title</h1>
          <p class="page-sub">What this page is for, in the product's language.</p>
        </div>
        <div class="page-actions"><button class="btn outline">Export</button><button class="btn">New item</button></div>
      </div>

      <div class="grid cols-3">
        <article class="card"><p class="card-title">The real content</p><p class="muted">of this state.</p></article>
        <article class="card"><p class="card-title">Another card</p><p class="muted">With realistic data.</p></article>
        <article class="card"><p class="card-title">A third</p><p class="muted">Consistent with the other screens.</p></article>
      </div>
    </main>
  </div>
</div>
</body>
</html>
